<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Dashboard TESLA</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        if (typeof window.supabase === 'undefined') {
            var _sbFallback = document.createElement('script');
            _sbFallback.src = 'https://unpkg.com/@supabase/supabase-js@2';
            document.head.appendChild(_sbFallback);
        }
    </script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --tesla-red: #DC2626;
            --tesla-gold: #FFB800;
            --tesla-dark: #1a1a1a;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #0f0f0f 100%);
        }

        .login-card {
            background: rgba(15, 15, 15, 0.98);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 10;
        }

        .input-field {
            background: rgba(30, 30, 30, 0.9);
            border: 2px solid var(--tesla-gold);
            color: white;
            transition: all 0.3s ease;
            font-size: 16px;
            /* Evita zoom en iOS */
        }

        .input-field:focus {
            outline: none;
            border-color: var(--tesla-red);
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.2);
        }

        .btn-login {
            background: linear-gradient(135deg, var(--tesla-red) 0%, #b91c1c 100%);
            color: var(--tesla-gold);
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(220, 38, 38, 0.3);
        }

        .error-message {
            background: rgba(220, 38, 38, 0.1);
            border-left: 4px solid var(--tesla-red);
            color: var(--tesla-gold);
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">
    <div class="login-card rounded-2xl shadow-2xl p-8 w-full max-w-md border-2 border-yellow-500">
        <!-- Logo y Título -->
        <div class="text-center mb-8">
            <img src="assets/logo.png" alt="TESLA Logo" class="h-20 w-20 mx-auto mb-4">
            <h1 class="text-3xl font-bold text-white mb-2">
                TESLA <span class="text-yellow-500">Dashboard</span>
            </h1>
            <p class="text-yellow-500 text-sm font-semibold">Acceso Administrativo</p>
        </div>

        <!-- Mensaje de Error -->
        <div id="errorMessage" class="error-message rounded-lg p-4 mb-6 hidden">
            <p class="text-sm font-semibold" id="errorText"></p>
        </div>

        <!-- Mensaje de Éxito -->
        <div id="successMessage"
            class="hidden bg-green-900/30 border-l-4 border-green-500 text-green-400 p-4 mb-6 rounded-lg">
            <p class="text-sm font-semibold" id="successText"></p>
        </div>

        <!-- Formulario de Login -->
        <form id="loginForm" class="space-y-6">
            <div>
                <label for="email" class="block text-yellow-500 text-sm font-bold mb-2">
                    📧 Correo Electrónico
                </label>
                <input type="email" id="email" class="input-field w-full px-4 py-3 rounded-lg"
                    placeholder="oyp.solucionesdeingenieria@gmail.com" required autocomplete="email">
            </div>

            <div class="relative">
                <label for="password" class="block text-yellow-500 text-sm font-bold mb-2">
                    🔒 Contraseña
                </label>
                <div class="relative">
                    <input type="password" id="password" class="input-field w-full px-4 py-3 rounded-lg pr-12"
                        placeholder="••••••••" required autocomplete="current-password">

                    <!-- Botón Ojo -->
                    <button type="button" id="togglePassword"
                        class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-yellow-500 focus:outline-none p-2">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" id="loginButton"
                class="btn-login w-full py-3 rounded-lg font-bold text-lg border-2 border-yellow-500 shadow-lg">
                🚀 Iniciar Sesión
            </button>
        </form>

        <!-- Link de Recuperación -->
        <div class="mt-6 text-center">
            <button onclick="showRecovery()"
                class="text-yellow-500 text-sm hover:text-yellow-400 transition bg-transparent border-none underline cursor-pointer">
                ¿Olvidaste tu contraseña?
            </button>
        </div>

        <!-- Footer -->
        <div class="mt-8 text-center">
            <p class="text-gray-500 text-xs">
                © 2024 TESLA Electricidad y Automatización S.A.C.
            </p>
        </div>
    </div>

    <script>
        // Configuración Supabase (Proyecto TESLA Activo)
        const SUPABASE_URL = 'https://fckbbohlxfqoyiomyxqm.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_lbRx3jVpe9P7gzl3B5gFEg_5GbQXXF0';

        // ========== MEMORIA DE CORREO (auto-guardado) ==========
        const EMAIL_MEMORY_KEY = 'tesla_admin_email';
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const togglePasswordBtn = document.getElementById('togglePassword');

        function rememberEmail() {
            const value = emailInput.value.trim();
            if (value) localStorage.setItem(EMAIL_MEMORY_KEY, value);
        }

        // Restaurar correo guardado la próxima vez
        const savedEmail = localStorage.getItem(EMAIL_MEMORY_KEY);
        if (savedEmail) {
            emailInput.value = savedEmail;
            passwordInput.focus();
        }

        // Auto-guardar mientras se escribe el correo
        emailInput.addEventListener('change', rememberEmail);
        emailInput.addEventListener('blur', rememberEmail);

        // ========== VISOR DE CONTRASEÑA (ojo) ==========
        // Se configura antes que Supabase para que SIEMPRE funcione
        function togglePasswordVisibility() {
            const show = passwordInput.getAttribute('type') === 'password';
            passwordInput.setAttribute('type', show ? 'text' : 'password');
            const icon = togglePasswordBtn.querySelector('i');
            if (icon) {
                icon.classList.toggle('fa-eye', !show);
                icon.classList.toggle('fa-eye-slash', show);
            }
            togglePasswordBtn.setAttribute('aria-label', show ? 'Ocultar contraseña' : 'Mostrar contraseña');
            passwordInput.focus();
        }
        togglePasswordBtn.addEventListener('click', togglePasswordVisibility);

        // ========== CONEXIÓN SUPABASE (no rompe el resto si falla) ==========
        let supabaseClient = null;
        try {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        } catch (err) {
            console.error('❌ No se pudo cargar Supabase:', err);
        }

        // Verificar si ya está autenticado
        async function checkAuth() {
            if (!supabaseClient) return;
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                // Ya está autenticado, redirigir al dashboard
                window.location.href = '/dashboard.html';
            }
        }

        // Mostrar error
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            errorText.textContent = message;
            errorDiv.classList.remove('hidden');
            document.getElementById('successMessage').classList.add('hidden');

            setTimeout(() => {
                errorDiv.classList.add('hidden');
            }, 5000);
        }

        // Manejar login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const button = document.getElementById('loginButton');
            const originalText = button.innerHTML;

            // Deshabilitar botón
            button.disabled = true;
            button.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Iniciando sesión...';

            if (!supabaseClient) {
                showError('❌ Supabase no cargó. Recarga la página o revisa tu conexión.');
                button.disabled = false;
                button.innerHTML = originalText;
                return;
            }

            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) throw error;

                // Login exitoso
                rememberEmail();
                console.log('✅ Login exitoso');
                // button.innerHTML = '<i class="fas fa-check"></i> ¡Bienvenido!'; 
                // No mostrar mensaje en botón, redireccionar directo

                window.location.href = '/dashboard.html';

            } catch (error) {
                console.error('❌ Error de login:', error);

                let errorMessage = 'Error al iniciar sesión';

                if (error.message.includes('Invalid login credentials')) {
                    errorMessage = '❌ Correo o contraseña incorrectos';
                } else if (error.message.includes('Email not confirmed')) {
                    errorMessage = '📧 Por favor confirma tu correo electrónico';
                } else if (error.message.includes('network')) {
                    errorMessage = '🌐 Error de conexión. Verifica tu internet';
                } else {
                    errorMessage = `❌ ${error.message}`;
                }

                showError(errorMessage);

                // Rehabilitar botón
                button.disabled = false;
                button.innerHTML = originalText;
            }
        });

        // Recuperación de contraseña (Mejorada)
        async function showRecovery() {
            const emailInput = document.getElementById('email');
            const email = emailInput.value;

            if (!email) {
                showError('⚠️ Por favor ingresa tu correo electrónico en el campo de arriba primero.');
                emailInput.focus();
                emailInput.classList.add('border-red-500');
                setTimeout(() => emailInput.classList.remove('border-red-500'), 2000);
                return;
            }

            const button = document.querySelector('button[onclick="showRecovery()"]');

            if (!confirm(`¿Enviar enlace de recuperación a ${email}?`)) return;

            const originalText = button.textContent;
            button.disabled = true;
            button.textContent = 'Enviando...';

            if (!supabaseClient) {
                showError('❌ Supabase no cargó. Recarga la página.');
                button.disabled = false;
                button.textContent = originalText;
                return;
            }

            try {
                const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
                    redirectTo: window.location.origin + '/reset-password.html'
                });

                if (error) throw error;

                const successDiv = document.getElementById('successMessage');
                document.getElementById('successText').textContent = `✅ Enlace enviado a ${email}. Revisa tu bandeja de entrada.`;
                successDiv.classList.remove('hidden');
                document.getElementById('errorMessage').classList.add('hidden');

            } catch (error) {
                showError('❌ Error: ' + error.message);
            } finally {
                button.disabled = false;
                button.textContent = originalText;
            }
        }

        // Verificar autenticación al cargar
        checkAuth();
    </script>
</body>

</html>
