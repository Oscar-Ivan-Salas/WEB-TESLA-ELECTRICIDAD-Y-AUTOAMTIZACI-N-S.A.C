<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#9b51e0" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="glassesGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>
  </defs>

  <!-- Background Circle Glow -->
  <circle cx="100" cy="100" r="90" fill="#090a10" stroke="url(#neonGlow)" stroke-width="4" filter="url(#glowEffect)" />
  
  <!-- Cat Ears -->
  <polygon points="55,65 35,25 75,45" fill="#121526" stroke="#00f2fe" stroke-width="3" />
  <polygon points="60,60 45,35 70,50" fill="#ff007f" opacity="0.8" />
  
  <polygon points="145,65 165,25 125,45" fill="#121526" stroke="#ff007f" stroke-width="3" />
  <polygon points="140,60 155,35 130,50" fill="#00f2fe" opacity="0.8" />

  <!-- Cat Head Base -->
  <path d="M 50,85 C 50,55 150,55 150,85 C 150,120 135,135 100,135 C 65,135 50,120 50,85 Z" fill="#16192e" stroke="url(#neonGlow)" stroke-width="3" />

  <!-- Cyber Tech Glasses / Sunglasses -->
  <rect x="58" y="72" width="38" height="24" rx="5" fill="#050714" stroke="url(#glassesGrad)" stroke-width="3" filter="url(#glowEffect)" />
  <rect x="104" y="72" width="38" height="24" rx="5" fill="#050714" stroke="url(#glassesGrad)" stroke-width="3" filter="url(#glowEffect)" />
  <line x1="96" y1="84" x2="104" y2="84" stroke="#ff007f" stroke-width="3" />
  <!-- Glasses Reflections -->
  <line x1="62" y1="76" x2="80" y2="76" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" />
  <line x1="108" y1="76" x2="126" y2="76" stroke="#ff007f" stroke-width="2" stroke-linecap="round" />

  <!-- Cat Nose & Whisker Dots -->
  <polygon points="96,100 104,100 100,105" fill="#ff007f" />
  <circle cx="85" cy="110" r="1.5" fill="#00f2fe" />
  <circle cx="78" cy="112" r="1.5" fill="#00f2fe" />
  <circle cx="115" cy="110" r="1.5" fill="#ff007f" />
  <circle cx="122" cy="112" r="1.5" fill="#ff007f" />

  <!-- Cat Paws on Laptop -->
  <ellipse cx="75" cy="140" rx="10" ry="6" fill="#00f2fe" />
  <ellipse cx="125" cy="140" rx="10" ry="6" fill="#ff007f" />

  <!-- Modern Glowing Laptop -->
  <path d="M 60,145 L 140,145 L 155,168 L 45,168 Z" fill="#0a0d1a" stroke="url(#neonGlow)" stroke-width="3" filter="url(#glowEffect)" />
  <!-- Keyboard Lines -->
  <line x1="65" y1="154" x2="135" y2="154" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="4,2" />
  <line x1="60" y1="160" x2="140" y2="160" stroke="#ff007f" stroke-width="1.5" stroke-dasharray="5,2" />

  <!-- Glowing Apple/Tesla-style Cat Logo on Laptop Base -->
  <circle cx="100" cy="161" r="3" fill="#00f2fe" filter="url(#glowEffect)" />
</svg>
